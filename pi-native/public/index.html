<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multidisplay</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif; background: #05070c; color: #e8ecf1;
    display: flex; overflow: hidden;
  }
  #sidebar {
    width: 300px; min-width: 300px; height: 100%; overflow-y: auto;
    background: #0b0d12; border-right: 1px solid rgba(80,120,255,0.12);
    padding-bottom: 40px;
  }
  #sidebar h1 { font-size: 16px; margin: 0; padding: 16px; border-bottom: 1px solid rgba(80,120,255,0.12); }
  #status { font-size: 11px; padding: 0 16px 12px; color: #8891a5; }
  #status.connected { color: #5fd97a; }
  #status.disconnected { color: #f7768e; }
  .sidebar-section { border-bottom: 1px solid rgba(80,120,255,0.12); padding: 12px 16px; }
  .sidebar-section label {
    font-size: 11px; letter-spacing: 1.5px; color: rgba(160,200,255,0.8);
    text-transform: uppercase; display: block; margin-bottom: 8px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .effect-btn {
    display: block; width: 100%; text-align: left; font-size: 13px;
    background: rgba(255,255,255,0.03); color: #cdd3e0; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 7px; padding: 9px 12px; margin-bottom: 5px; cursor: pointer;
  }
  .effect-btn:hover { background: rgba(80,120,255,0.12); color: #fff; }
  .effect-btn.active { background: rgba(80,120,255,0.22); border-color: rgba(100,160,255,0.5); color: #7aadff; }
  button.panel-btn {
    background: rgba(255,255,255,0.03); color: #cdd3e0; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px; padding: 7px 11px; font-size: 12px; cursor: pointer;
  }
  button.panel-btn:hover { background: rgba(80,120,255,0.12); }
  button.panel-btn.active { background: rgba(80,120,255,0.22); border-color: rgba(100,160,255,0.5); color: #7aadff; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .slider-row label { width: auto; margin: 0; text-transform: none; font-size: 12px; letter-spacing: 0; color: #b7bfd1; flex: 0 0 66px; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row span { width: 36px; text-align: right; font-size: 11px; color: #8891a5; }
  #bt-log { white-space: pre-wrap; font-family: monospace; font-size: 10px; background: #12151d; border: 1px solid #2c3141; border-radius: 6px; padding: 6px; margin-top: 6px; max-height: 120px; overflow-y: auto; color: #b7bfd1; }
  .device-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; }
  .device-row .mac { color: #8891a5; font-family: monospace; font-size: 10px; flex: 1; }
  #viewport { flex: 1; position: relative; height: 100%; }
  #viewport canvas.gl { display: block; width: 100%; height: 100%; }
  #viewport-label { position: absolute; top: 12px; left: 16px; font-size: 12px; color: rgba(200,210,230,0.55); letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Multidisplay</h1>
    <div id="status" class="disconnected">connecting...</div>

    <div class="sidebar-section">
      <label>Effect</label>
      <div id="effect-buttons"></div>
    </div>

    <div class="sidebar-section">
      <label>Brightness / Speed</label>
      <div class="slider-row">
        <label>Brightness</label>
        <input type="range" id="brightness" min="0" max="1.5" step="0.05" value="1">
        <span id="brightness-val">1.0</span>
      </div>
      <div class="slider-row">
        <label>Speed</label>
        <input type="range" id="speed" min="0" max="8" step="0.1" value="1">
        <span id="speed-val">1.0</span>
      </div>
    </div>

    <div class="sidebar-section">
      <label>Panel Layout</label>
      <div class="row" id="panel-buttons"></div>
    </div>

    <div class="sidebar-section">
      <label>Bluetooth</label>
      <div class="row">
        <button class="panel-btn" id="bt-scan">Scan</button>
        <button class="panel-btn" id="bt-status">Paired</button>
        <button class="panel-btn" id="bt-discoverable">Pair phone</button>
        <button class="panel-btn" id="bt-route">Route audio</button>
      </div>
      <div id="bt-devices"></div>
      <div id="bt-log">Bluetooth results appear here.</div>
    </div>
  </div>

  <div id="viewport">
    <div id="viewport-label">live preview</div>
  </div>

<script src="three.min.js"></script>
<script>
const PANEL_SIZES = [8, 16, 64];
const FACE_NAMES = ['Front', 'Back', 'Right', 'Left', 'Top', 'Bottom'];
// Cube face normals/positions, matching cube.js: 0=Front(z+) 1=Back(z-) 2=Right(x+) 3=Left(x-) 4=Top(y+) 5=Bottom(y-)
const FACE_XFORM = [
  { pos: [0, 0, 1],  rot: [0, 0, 0] },
  { pos: [0, 0, -1], rot: [0, Math.PI, 0] },
  { pos: [1, 0, 0],  rot: [0, Math.PI / 2, 0] },
  { pos: [-1, 0, 0], rot: [0, -Math.PI / 2, 0] },
  { pos: [0, 1, 0],  rot: [-Math.PI / 2, 0, 0] },
  { pos: [0, -1, 0], rot: [Math.PI / 2, 0, 0] },
];

let ws;
let effectNames = {};
let currentState = { effect: null, brightness: 1, speed: 1, panelSize: 64, panelMode: '2d' };
const faceCanvases = {}; // face -> {canvas, ctx, imgData, texture}

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${location.port || 8081}`);
  ws.binaryType = 'arraybuffer';
  const statusEl = document.getElementById('status');

  ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.className = 'connected'; };
  ws.onclose = () => { statusEl.textContent = 'disconnected - retrying...'; statusEl.className = 'disconnected'; setTimeout(connect, 2000); };
  ws.onerror = () => { ws.close(); };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      handleTextMessage(JSON.parse(ev.data));
    } else {
      handleFrame(ev.data);
    }
  };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleTextMessage(msg) {
  if (msg.cmd === 'state') {
    const modeChanged = msg.panelMode !== currentState.panelMode || msg.panelSize !== currentState.panelSize;
    currentState = msg;
    renderEffectButtons();
    renderPanelButtons();
    document.getElementById('brightness').value = msg.brightness;
    document.getElementById('brightness-val').textContent = Number(msg.brightness).toFixed(2);
    document.getElementById('speed').value = msg.speed;
    document.getElementById('speed-val').textContent = Number(msg.speed).toFixed(1);
    if (modeChanged) rebuildScene();
  } else if (msg.cmd.startsWith('bt') && msg.cmd.endsWith('Result')) {
    handleBtResult(msg);
  }
}

async function loadEffectNames() {
  const resp = await fetch('/effects.json');
  effectNames = await resp.json();
  renderEffectButtons();
}

function renderEffectButtons() {
  const container = document.getElementById('effect-buttons');
  container.innerHTML = '';
  for (const [key, label] of Object.entries(effectNames)) {
    const btn = document.createElement('button');
    btn.className = 'effect-btn' + (key === currentState.effect ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => send({ cmd: 'setEffect', effect: key });
    container.appendChild(btn);
  }
}

function renderPanelButtons() {
  const container = document.getElementById('panel-buttons');
  container.innerHTML = '';
  for (const size of PANEL_SIZES) {
    const btn = document.createElement('button');
    btn.className = 'panel-btn' + (currentState.panelMode === 'cube' && currentState.panelSize === size ? ' active' : '');
    btn.textContent = `${size}x${size} cube`;
    btn.onclick = () => send({ cmd: 'setPanelConfig', size, mode: 'cube' });
    container.appendChild(btn);
  }
  const btn2d = document.createElement('button');
  btn2d.className = 'panel-btn' + (currentState.panelMode === '2d' ? ' active' : '');
  btn2d.textContent = '2D (1 panel)';
  btn2d.onclick = () => send({ cmd: 'setPanelConfig', size: currentState.panelSize || 64, mode: '2d' });
  container.appendChild(btn2d);
}

// ---- Three.js preview ----
let renderer, scene, camera, group;

function initScene() {
  const viewport = document.getElementById('viewport');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.domElement.className = 'gl';
  viewport.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));

  window.addEventListener('resize', resizeRenderer);
  resizeRenderer();
  rebuildScene();
  animate();
}

function resizeRenderer() {
  const viewport = document.getElementById('viewport');
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function rebuildScene() {
  if (group) { scene.remove(group); }
  group = new THREE.Group();
  scene.add(group);
  for (const key in faceCanvases) delete faceCanvases[key];

  const size = currentState.panelSize || 64;
  const faceCount = currentState.panelMode === '2d' ? 1 : 6;

  for (let face = 0; face < faceCount; face++) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    faceCanvases[face] = { canvas, ctx, imgData: ctx.createImageData(size, size), texture };

    const mat = new THREE.MeshBasicMaterial({ map: texture });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);

    if (faceCount === 1) {
      group.add(plane);
    } else {
      const xf = FACE_XFORM[face];
      plane.position.set(xf.pos[0] * 1.001, xf.pos[1] * 1.001, xf.pos[2] * 1.001);
      plane.rotation.set(xf.rot[0], xf.rot[1], xf.rot[2]);
      group.add(plane);
    }
  }

  camera.position.set(faceCount === 1 ? 0 : 2.6, faceCount === 1 ? 0 : 2.0, faceCount === 1 ? 2.4 : 2.6);
  camera.lookAt(0, 0, 0);
}

function animate() {
  requestAnimationFrame(animate);
  if (group && currentState.panelMode !== '2d') group.rotation.y += 0.003;
  renderer.render(scene, camera);
}

function handleFrame(buf) {
  const bytes = new Uint8Array(buf);
  const face = bytes[0];
  const entry = faceCanvases[face];
  if (!entry) return;
  const size = currentState.panelSize;
  const { ctx, imgData, texture } = entry;
  const px = imgData.data;
  for (let i = 0; i < size * size; i++) {
    px[i * 4]     = bytes[1 + i * 3];
    px[i * 4 + 1] = bytes[1 + i * 3 + 1];
    px[i * 4 + 2] = bytes[1 + i * 3 + 2];
    px[i * 4 + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  texture.needsUpdate = true;
}

document.getElementById('brightness').addEventListener('input', (e) => {
  document.getElementById('brightness-val').textContent = Number(e.target.value).toFixed(2);
  send({ cmd: 'setBrightness', value: Number(e.target.value) });
});
document.getElementById('speed').addEventListener('input', (e) => {
  document.getElementById('speed-val').textContent = Number(e.target.value).toFixed(1);
  send({ cmd: 'setSpeed', value: Number(e.target.value) });
});

// ---- Bluetooth ----
const btLog = document.getElementById('bt-log');
const btDevices = document.getElementById('bt-devices');
function logBt(text) { btLog.textContent = text; }

document.getElementById('bt-scan').onclick = () => { logBt('Scanning (~6s)...'); send({ cmd: 'btScan' }); };
document.getElementById('bt-status').onclick = () => { logBt('Checking paired devices...'); send({ cmd: 'btStatus' }); };
document.getElementById('bt-discoverable').onclick = () => { logBt('Opening pairing window (~120s)...'); send({ cmd: 'btDiscoverable' }); };
document.getElementById('bt-route').onclick = () => { logBt('Routing phone audio...'); send({ cmd: 'btRoutePhoneAudio' }); };

function handleBtResult(msg) {
  if (!msg.ok) { logBt('Error: ' + (msg.error || 'unknown')); return; }
  if (msg.cmd === 'btScanResult' || msg.cmd === 'btStatusResult') {
    logBt(`${msg.devices.length} device(s) found.`);
    btDevices.innerHTML = '';
    for (const d of msg.devices) {
      const row = document.createElement('div');
      row.className = 'device-row';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = d.name;
      const macSpan = document.createElement('span');
      macSpan.className = 'mac';
      macSpan.textContent = d.mac;
      const pairBtn = document.createElement('button');
      pairBtn.className = 'panel-btn';
      pairBtn.textContent = 'Pair';
      pairBtn.onclick = () => { logBt('Pairing with ' + d.name + '...'); send({ cmd: 'btPair', mac: d.mac }); };
      row.append(nameSpan, macSpan, pairBtn);
      btDevices.appendChild(row);
    }
  } else {
    logBt('OK: ' + JSON.stringify(msg.log || msg, null, 2));
  }
}

loadEffectNames();
connect();
initScene();
</script>
</body>
</html>
