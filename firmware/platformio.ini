; PlatformIO Project Configuration File
; ESP32-S3 RGB LED Cube firmware (Multidisplay)

; data_dir is a GLOBAL setting, not a per-environment one - it belongs here,
; in [platformio], not inside [env:...]. It was previously placed under
; [env:esp32-s3-devkitc-1], where PlatformIO silently ignores unknown
; options ("Warning! Ignore unknown configuration option `data_dir`") -
; meaning every buildfs/uploadfs run kept using the default firmware/data
; folder instead of ../data (where build.sh/build.ps1 actually write),
; packaging stale content for who knows how long.
[platformio]
data_dir = ../data

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16MB flash, 8MB quad-SPI PSRAM ---
; The generic "esp32-s3-devkitc-1" board definition defaults to an 8MB
; flash / no-PSRAM variant (confirmed via `pio run -v` showing
; "ESP32-S3-DevKitC-1-N8 ... No PSRAM"). These two overrides force the
; actual N16R8 hardware config regardless of that default — without them,
; psramFound() returns false and the PSRAM frame buffer allocation in
; main.cpp's allocBuffers() fails at boot even though the firmware compiles
; fine.
;
; memory_type must be qio_qspi, NOT qio_opi: ESP32-S3-WROOM-1 modules (which
; is what's on this board, "N16R8" printed on it) use quad-SPI PSRAM.
; qio_opi is for octal-SPI PSRAM (WROOM-2 and similar modules) - setting the
; wrong one made the SDK think PSRAM was unusable at boot ("Not enough
; memory for requested colour depth" from the HUB75 library, plus knock-on
; WiFi task creation failures from the same broken memory init).
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
; f_flash stays 80MHz: tried dropping to 40MHz to ease PSRAM enumeration
; ("PSRAM ID read error: 0x00ffffff" appearing consistently late in a long
; session of resets/reflashes), but this framework version has no prebuilt
; qio_40m bootloader ("bootloader_qio_40m.elf not found") - only specific
; flash_mode/freq combos ship one. 80MHz was also already the setting during
; every earlier successful boot tonight, so it likely isn't the actual
; variable at fault anyway.
board_build.f_flash = 80000000L
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs

; Tried underclocking to 160MHz to ease PSRAM enumeration - reverted. It
; didn't fix PSRAM (failed again on the very next boot, identical config to
; a boot that had succeeded) and caused a NEW failure: the HUB75 library's
; internal DMA timing is calibrated for the default 240MHz clock, so
; underclocking made the display task miss watchdog deadlines
; ("task_wdt... Tasks currently running: CPU 0: display... Aborting").
board_build.f_cpu = 240000000L

; --- lwIP TCP connection pool / TIME_WAIT tuning (experimental) ---
; Live testing showed the board goes unreachable (ping + HTTP both stop,
; no crash) after just 1-2 quick page refreshes, with free heap staying
; completely healthy throughout - ruling out memory exhaustion. That
; points at a small, fixed-size lwIP resource (the active-TCP-PCB pool
; and/or how long a closed connection lingers in TIME_WAIT before its
; slot is reusable) getting exhausted by the burst of connections a
; single page load opens. These raise the pool size and shorten how long
; a closed connection holds its slot. Unverified against this exact
; platform/IDF version's actual Kconfig option names/defaults (no docs
; access in the environment that authored this) - if the build warns
; these options don't exist, they're likely just being ignored rather
; than breaking anything, but flag it back if you see a hard error.
board_build.esp-idf.custom_sdkconfig =
    CONFIG_LWIP_MAX_ACTIVE_TCP=32
    CONFIG_LWIP_MAX_LISTENING_TCP=16
    CONFIG_LWIP_TCP_MSL=3000

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
    ; Without these, Arduino's Serial object defaults to UART0 hardware
    ; pins - on a board with no separate USB-UART bridge chip (native
    ; USB-Serial-JTAG only), those pins aren't wired to the exposed USB
    ; connector at all, so every Serial.print() goes nowhere even though
    ; the port itself still opens fine for flashing (that uses the
    ; always-on ROM-level USB-Serial-JTAG channel, a separate thing).
    ; These flags remap Serial to actually BE the native USB-CDC endpoint.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; Swapped from the esphome fork to the actively-maintained ESP32Async
    ; fork (same project, esphome's is a stale snapshot). The esphome fork
    ; has a long-reported class of bug where the board stops responding to
    ; ANY request (including ping) after a handful of quick page
    ; loads/refreshes, with free heap staying completely healthy the whole
    ; time - matches an internal TCP PCB/event-queue leak on connection
    ; close that isn't heap-related at all. Referenced by git URL rather
    ; than the PlatformIO registry name to avoid ambiguity between forks.
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
    bodmer/TJpg_Decoder @ ^1.1.0
