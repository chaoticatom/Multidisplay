; PlatformIO Project Configuration File
; ESP32-S3 RGB LED Cube firmware (Multidisplay)

; data_dir is a GLOBAL setting, not a per-environment one - it belongs here,
; in [platformio], not inside [env:...]. It was previously placed under
; [env:esp32-s3-devkitc-1], where PlatformIO silently ignores unknown
; options ("Warning! Ignore unknown configuration option `data_dir`") -
; meaning every buildfs/uploadfs run kept using the default firmware/data
; folder instead of ../data (where build.sh/build.ps1 actually write),
; packaging stale content for who knows how long.
[platformio]
data_dir = ../data

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Revisiting PSRAM SPI mode: esptool's own chip readout on every single
; flash this session has said "Embedded PSRAM 8MB (AP_3v3)" - "Embedded"
; means the PSRAM die is packaged INSIDE the ESP32-S3 chip itself (a QFN56
; combo chip, the S3R8 variant), and Espressif's embedded-PSRAM chips use
; OCTAL SPI (OPI), not quad SPI. qio_qspi (quad-SPI PSRAM) was set based on
; the board's "N16R8" silkscreen text assuming a WROOM-1 module with a
; separate external quad-SPI PSRAM chip - but the live esptool readout
; contradicts that assumption for the PSRAM specifically. qio_opi (quad-SPI
; flash + octal-SPI PSRAM) matches "embedded PSRAM + external quad flash"
; and was tried once before, but that attempt predates this session's
; buffer-allocation fix (HUB75_WIRED_PANELS limiting frame buffers to the 1
; physically-wired panel instead of all 6) - the earlier "not enough memory
; for requested colour depth" failure may have been that separate bug
; compounding, not proof qio_opi itself is wrong. Worth a clean retry now.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
; f_flash stays 80MHz: tried dropping to 40MHz to ease PSRAM enumeration
; ("PSRAM ID read error: 0x00ffffff" appearing consistently late in a long
; session of resets/reflashes), but this framework version has no prebuilt
; qio_40m bootloader ("bootloader_qio_40m.elf not found") - only specific
; flash_mode/freq combos ship one. 80MHz was also already the setting during
; every earlier successful boot tonight, so it likely isn't the actual
; variable at fault anyway.
board_build.f_flash = 80000000L
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs

; Tried underclocking to 160MHz to ease PSRAM enumeration - reverted. It
; didn't fix PSRAM (failed again on the very next boot, identical config to
; a boot that had succeeded) and caused a NEW failure: the HUB75 library's
; internal DMA timing is calibrated for the default 240MHz clock, so
; underclocking made the display task miss watchdog deadlines
; ("task_wdt... Tasks currently running: CPU 0: display... Aborting").
board_build.f_cpu = 240000000L

; Reverted lwIP TCP pool experiment (CONFIG_LWIP_MAX_ACTIVE_TCP etc.) - it
; didn't fix the wedge, and enlarging lwIP's PCB pools most likely reserves
; extra static RAM at boot on a board already critically short on heap
; (~8-14KB free), making things worse rather than better. Even /api/status,
; which had stayed reliable through every other experiment, started failing
; after this was added.

; Core dump to flash: every boot has logged "No core dump partition
; found!" - meaning if something IS actually panicking at a level below
; our own application code (e.g. inside the WiFi driver/lwIP, distinct
; from the "loop() stays alive" wedge already confirmed live), we have
; zero visibility into it. Needs the `coredump` partition added to
; partitions_16MB.csv. main.cpp's setup() checks for and prints a
; summary of any dump found, then erases it, so nothing extra needs
; running on the PC side to read it.
board_build.esp-idf.custom_sdkconfig =
    CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
    CONFIG_ESP_COREDUMP_CHECK_BOOT=y
    CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
    ; AsyncTCP hands TCP events (data sent/received/etc.) from the lwIP
    ; core task to its own processing task through a small FIXED-SIZE
    ; FreeRTOS queue (default 32 entries). A big file needs many chunks in
    ; quick succession - each one is a queue entry - while a tiny JSON
    ; response (/api/status) only ever needs one. Matches every symptom
    ; observed live: /api/status refreshes fine repeatedly, only
    ; three.min.js (the one file we've hammered directly) fails, a
    ; different amount of it arrives each time (a timing race, not a
    ; fixed threshold), and the WHOLE network stack - ping included -
    ; wedges afterward (the lwIP core task blocks trying to push into a
    ; full queue, and that's the same task that services all network
    ; traffic, not just this one connection). Raising the queue size gives
    ; it far more headroom to drain before that happens.
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=256
    ; Without these, Arduino's Serial object defaults to UART0 hardware
    ; pins - on a board with no separate USB-UART bridge chip (native
    ; USB-Serial-JTAG only), those pins aren't wired to the exposed USB
    ; connector at all, so every Serial.print() goes nowhere even though
    ; the port itself still opens fine for flashing (that uses the
    ; always-on ROM-level USB-Serial-JTAG channel, a separate thing).
    ; These flags remap Serial to actually BE the native USB-CDC endpoint.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; Swapped from the esphome fork to the actively-maintained ESP32Async
    ; fork (same project, esphome's is a stale snapshot). The esphome fork
    ; has a long-reported class of bug where the board stops responding to
    ; ANY request (including ping) after a handful of quick page
    ; loads/refreshes, with free heap staying completely healthy the whole
    ; time - matches an internal TCP PCB/event-queue leak on connection
    ; close that isn't heap-related at all. Referenced by git URL rather
    ; than the PlatformIO registry name to avoid ambiguity between forks.
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
    bodmer/TJpg_Decoder @ ^1.1.0
